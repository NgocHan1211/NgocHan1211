<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Tran Ngoc Han — Data, AI and QA</title><desc id="desc">Pastel editorial banner for Tran Ngoc Han's GitHub profile</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fffccb"/><stop offset=".5" stop-color="#f4efff"/><stop offset="1" stop-color="#fff0f7"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#319d8e"/><stop offset=".5" stop-color="#5f82d7"/><stop offset="1" stop-color="#a05d9e"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1a8"/><stop offset=".45" stop-color="#f2b84b"/><stop offset="1" stop-color="#c9822f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#675987" flood-opacity=".13"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 315C215 265 380 351 598 302s404-23 602-84v142H0z" fill="#ffffff" opacity=".58"/>
  <circle cx="1000" cy="181" r="123" fill="#ffffff" opacity=".35"/>
  <rect x="70" y="55" width="76" height="76" rx="14" fill="#fff" stroke="#319d8e" stroke-width="2" transform="rotate(-3 108 93)" filter="url(#shadow)"/><text x="108" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#51466f">NH</text>
  <text x="70" y="185" font-family="Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-2" fill="#29243f">Tran Ngoc Han</text>
  <rect x="70" y="208" width="490" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="256" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#5f5875">DATA SCIENCE · AI/ML RESEARCH · QA</text>
  <text x="70" y="297" font-family="Arial,sans-serif" font-size="18" fill="#69617f">Turning complex data into useful systems.</text>
  <g transform="translate(1000 181)">
    <g opacity=".62">
      <circle r="116" fill="none" stroke="#8064b8" stroke-width="1.5" stroke-dasharray="8 11"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle>
      <circle r="91" fill="none" stroke="#319d8e" stroke-width="1.5" stroke-dasharray="3 10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/></circle>
    </g>
    <g filter="url(#shadow)">
      <circle r="69" fill="#fff" fill-opacity=".86" stroke="#8064b8" stroke-opacity=".22"/>
      <path d="M-30-38h60v17c0 29-16 48-30 48s-30-19-30-48z" fill="url(#gold)" stroke="#b9752f" stroke-width="2"/>
      <path d="M-30-27h-17v8c0 18 10 29 27 30M30-27h17v8c0 18-10 29-27 30" fill="none" stroke="#d99838" stroke-width="7" stroke-linecap="round"/>
