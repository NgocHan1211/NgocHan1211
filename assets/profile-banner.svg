      <path d="M-91-48v16M-99-40h16"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></path>
      <path d="M86-70v20M76-60h20"><animate attributeName="opacity" values="1;.18;1" dur="2.2s" repeatCount="indefinite"/></path>
      <path d="M97 47v14M90 54h14"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></path>
      <path d="M-78 74v12M-84 80h12"><animate attributeName="opacity" values="1;.25;1" dur="2.5s" repeatCount="indefinite"/></path>
